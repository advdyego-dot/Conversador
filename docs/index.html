<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conversador</title>
<meta name="description" content="Intérprete de bolso: fale, faça uma pausa e ouça a tradução.">
<meta name="theme-color" content="#0f6e74">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conversador">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #f3f6f7; --surface: #ffffff; --ink: #14232b; --muted: #5b6d76; --line: #d8e1e5;
  --me: #0f6e74; --me-soft: #dff0f0; --them: #b4542b; --them-soft: #f8e7dd; --live: #d23c3c;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f171b; --surface: #172329; --ink: #e6eef1; --muted: #93a6ae; --line: #26363e;
  --me: #49b8bd; --me-soft: #163437; --them: #ec8a5d; --them-soft: #3a2419; --live: #ff6b6b; color-scheme: dark } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.01em; }
.sub { margin: 0; color: var(--muted); font-size: .9rem; }
select, textarea, button { font: inherit; color: inherit; }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.tag { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

.pads { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pad { border: 3px solid transparent; border-radius: 18px; min-height: 170px; padding: 16px 10px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; touch-action: manipulation; }
.pad.me { background: var(--me-soft); color: var(--me); }
.pad.them { background: var(--them-soft); color: var(--them); }
.pad svg { width: 44px; height: 44px; }
.pad .who { font-weight: 700; font-size: 1.15rem; }
.pad .hint { font-size: .82rem; color: var(--muted); }
.pad.on { border-color: var(--live); }
.pad.on svg { color: var(--live); animation: pulse 1.1s ease-in-out infinite; }
.pad:disabled { opacity: .45; }
.pad:focus-visible, .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
@keyframes pulse { 50% { transform: scale(1.15); } }
@media (prefers-reduced-motion: reduce) { .pad.on svg { animation: none; } }

.status { min-height: 1.5em; color: var(--muted); font-size: .95rem; }
.status.live { color: var(--live); font-weight: 600; }
.live-text { min-height: 1.5em; font-size: 1.1rem; }
.live-text .partial { color: var(--muted); }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: .92rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.btn.primary { background: var(--me); border-color: var(--me); color: var(--bg); font-weight: 600; }
.btn.alt { background: var(--them); border-color: var(--them); color: var(--bg); font-weight: 600; }
textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }

details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
summary { cursor: pointer; font-weight: 600; }
.settings { display: grid; gap: 12px; padding-top: 10px; }
.settings label { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
input[type=range], input[type=checkbox] { accent-color: var(--me); }

.log-head { display: flex; justify-content: space-between; align-items: center; }
.log-head h2 { margin: 0; font-size: 1.05rem; }
.log { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--me); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.card.them { border-left-color: var(--them); }
.card .orig { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.card .tr { font-size: 1.15rem; font-weight: 500; margin-top: 4px; overflow-wrap: anywhere; }
.card .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; }
.play { border: 0; background: none; color: var(--me); font-weight: 600; cursor: pointer; padding: 4px; }
.card.them .play { color: var(--them); }
.empty { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Conversador</h1>
      <p class="sub">Fale, faça uma pausa e ouça a tradução.</p>
    </div>
    <label class="row"><span class="tag">Outra língua</span>
      <select id="other">
        <option value="en">Inglês</option>
        <option value="es">Espanhol</option>
        <option value="fr">Francês</option>
        <option value="it">Italiano</option>
        <option value="de">Alemão</option>
        <option value="zh">Chinês</option>
        <option value="ja">Japonês</option>
      </select>
    </label>
  </header>

  <div class="pads">
    <button class="pad me" id="padMe" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span class="who">Eu falo</span>
      <span class="hint" id="hintMe">Português → Inglês</span>
    </button>
    <button class="pad them" id="padThem" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span class="who" id="whoThem">Other person</span>
      <span class="hint" id="hintThem">Inglês → Português</span>
    </button>
  </div>

  <div>
    <div class="status" id="status" aria-live="polite">Toque em quem vai falar.</div>
    <div class="live-text" id="liveText"></div>
  </div>

  <div class="notice" id="noMic" hidden>
    Este navegador não oferece reconhecimento de voz. Use o Chrome no Android ou o Safari no iPhone.
    Enquanto isso, digite ou use o microfone do teclado no campo abaixo.
  </div>
  <div class="notice" id="installTip" hidden></div>

  <form id="typedForm" class="row" style="flex-direction:column;align-items:stretch">
    <label for="typed" class="tag">Ou digite</label>
    <textarea id="typed" placeholder="Escreva aqui a frase a traduzir"></textarea>
    <div class="row">
      <button class="btn primary" type="submit" data-side="me">Traduzir o que eu disse</button>
      <button class="btn alt" type="submit" data-side="them">Traduzir o que a outra pessoa disse</button>
    </div>
  </form>

  <details>
    <summary>Ajustes</summary>
    <div class="settings">
      <label for="auto">Depois da tradução, ouvir o outro lado sozinho <input type="checkbox" id="auto" checked></label>
      <label for="pause">Pausa que encerra a fala <span><input type="range" id="pause" min="0.8" max="3" step="0.1" value="1.5"> <b id="pauseVal">1,5 s</b></span></label>
      <label for="rate">Velocidade da voz <span><input type="range" id="rate" min="0.6" max="1.4" step="0.05" value="1"> <b id="rateVal">1,0×</b></span></label>
    </div>
  </details>

  <section>
    <div class="log-head"><h2>Conversa</h2><button class="btn" type="button" id="clear">Limpar</button></div>
    <div class="log" id="log"></div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
